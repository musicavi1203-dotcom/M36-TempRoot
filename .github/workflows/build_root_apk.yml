name: Build Temp Root APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          echo "y" | sdkmanager --install "ndk;25.2.9519653"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: Create project structure
        run: |
          mkdir -p app/src/main/java/com/m36/temproot
          mkdir -p app/src/main/jni
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/mipmap-hdpi

      - name: Create AndroidManifest.xml
        run: |
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.m36.temproot">
              <application
                  android:allowBackup="true"
                  android:label="M36 TempRoot"
                  android:theme="@android:style/Theme.Material.Light">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Create MainActivity.kt
        run: |
          cat > app/src/main/java/com/m36/temproot/MainActivity.kt << 'EOF'
          package com.m36.temproot

          import android.os.Bundle
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(50, 50, 50, 50)
                  }
                  val status = TextView(this).apply {
                      text = "M36 Temp Root\nNot running"
                      textSize = 18f
                  }
                  val button = Button(this).apply {
                      text = "Run Exploit"
                      setOnClickListener {
                          status.text = "Running exploit..."
                          Thread {
                              val result = try {
                                  val process = Runtime.getRuntime().exec("su -c id")
                                  val output = process.inputStream.bufferedReader().readText()
                                  "Result: $output"
                              } catch (e: Exception) {
                                  "Native exploit not yet implemented.\nError: ${e.message}"
                              }
                              runOnUiThread { status.text = result }
                          }.start()
                      }
                  }
                  layout.addView(status)
                  layout.addView(button)
                  setContentView(layout)
              }
          }
          EOF

      - name: Create build.gradle files
        run: |
          cat > build.gradle << 'EOF'
          buildscript {
              ext.kotlin_version = '1.9.0'
              repositories { google(); mavenCentral() }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.0'
                  classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
              }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF

          cat > app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.m36.temproot'
              compileSdk 34
              defaultConfig {
                  applicationId "com.m36.temproot"
                  minSdk 28
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
                  ndk { abiFilters 'arm64-v8a' }
              }
              buildTypes { release { minifyEnabled false } }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.core:core-ktx:1.12.0'
          }
          EOF

          cat > settings.gradle << 'EOF'
          rootProject.name = "M36-TempRoot"
          include ':app'
          EOF

          cat > gradle.properties << 'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

      - name: Create offsets header
        run: |
          cat > app/src/main/jni/offsets.h << 'EOF'
          #ifndef OFFSETS_H
          #define OFFSETS_H

          // Extracted from M36 boot_a.img
          // Kernel: 4.19.191
          // Security patch: 2023-04-05
          #define COMMIT_CREDS_ADDR        0xffffff80080e03dcUL
          #define PREPARE_KERNEL_CRED_ADDR 0xffffff80080e067cUL
          #define INIT_CRED_ADDR           0xffffff8009787f48UL
          #define INIT_TASK_ADDR           0xffffff800977b840UL

          #endif
          EOF

      - name: Create exploit skeleton
        run: |
          cat > app/src/main/jni/exploit.c << 'EOF'
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <unistd.h>
          #include <fcntl.h>
          #include <sys/syscall.h>
          #include <linux/futex.h>
          #include <pthread.h>
          #include <sys/mman.h>
          #include <jni.h>
          #include <android/log.h>

          #include "offsets.h"

          #define TAG "M36Root"
          #define LOGI(...) __android_log_print(ANDROID_LOG_INFO, TAG, __VA_ARGS__)
          #define LOGE(...) __android_log_print(ANDROID_LOG_ERROR, TAG, __VA_ARGS__)

          // Note: The actual GhostLock exploit logic (futex UAF)
          // needs to be implemented here based on the public PoC.
          // This skeleton verifies the build process works.

          int check_root() {
              return (getuid() == 0 || geteuid() == 0) ? 1 : 0;
          }

          jstring Java_com_m36_temproot_MainActivity_runExploitNative(JNIEnv* env, jobject thiz) {
              char result[256];
              if (check_root()) {
                  snprintf(result, sizeof(result), "Already root");
              } else {
                  snprintf(result, sizeof(result),
                      "Exploit skeleton loaded. Offsets:\n"
                      "commit_creds=0x%lx\nprepare_kernel_cred=0x%lx\ninit_cred=0x%lx\n"
                      "Full GhostLock logic not yet implemented.",
                      (unsigned long)COMMIT_CREDS_ADDR,
                      (unsigned long)PREPARE_KERNEL_CRED_ADDR,
                      (unsigned long)INIT_CRED_ADDR);
              }
              return (*env)->NewStringUTF(env, result);
          }
          EOF

      - name: Create CMakeLists.txt
        run: |
          cat > app/src/main/jni/CMakeLists.txt << 'EOF'
          cmake_minimum_required(VERSION 3.18)
          project(m36exploit)
          add_library(m36exploit SHARED exploit.c)
          find_library(log-lib log)
          target_link_libraries(m36exploit ${log-lib})
          EOF

      - name: Configure gradle for native build
        run: |
          cat >> app/build.gradle << 'EOF'
          android {
              externalNativeBuild {
                  cmake {
                      path "src/main/jni/CMakeLists.txt"
                      version "3.22.1"
                  }
              }
          }
          EOF

      - name: Build APK
        run: |
          chmod +x gradlew 2>/dev/null || gradle wrapper --gradle-version 8.1.1
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: M36-TempRoot-APK
          path: app/build/outputs/apk/debug/app-debug.apk
