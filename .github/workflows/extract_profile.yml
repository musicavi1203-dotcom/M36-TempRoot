name: get_real_profile
on: [workflow_dispatch]

jobs:
  get_profile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GhostLock
        uses: actions/checkout@v4
        with:
          repository: YuKongA/ghostlock-app
          
      - name: Show real profile structure
        run: |
          echo "=== List of built-in profiles ==="
          ls -la app/src/main/assets/kernel_profiles/
          
          echo "=== Content of ONE real profile ==="
          # מציג את הפרופיל הראשון שנמצא בתיקייה
          cat app/src/main/assets/kernel_profiles/* | head -n 100
          
          echo "=== Defaults.md (if exists) ==="
          find . -name "defaults.md" -exec cat {} \;
