name: extract_real_offsets
on: [push, workflow_dispatch]

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout M36-TempRoot
        uses: actions/checkout@v4

      - name: Prepare boot.img + vmlinux
        run: |
          unzip boot_a.zip
          git clone https://android.googlesource.com/platform/system/tools/mkbootimg
          PYTHONPATH=mkbootimg python3 mkbootimg/unpack_bootimg.py --boot_img boot_a.img --out boot_unpacked
          cd boot_unpacked
          cp kernel kernel_raw.gz && gunzip kernel_raw.gz
          pip3 install vmlinux-to-elf
          vmlinux-to-elf kernel_raw kernel.elf

      - name: Install pahole
        run: |
          sudo apt-get update
          sudo apt-get install -y dwarves

      - name: Extract struct offsets with pahole
        run: |
          cd boot_unpacked
          echo "=== TASK_STRUCT OFFSETS ==="
          pahole -C task_struct kernel.elf 2>/dev/null | grep -E "real_cred|cred|comm|tasks|pid|tgid|prio|normal_prio|pi_lock|pi_waiters|pi_top_task|pi_blocked_on|atomic_flags|seccomp|sched_task_group" || echo "pahole failed (no DWARF)"
          
          echo ""
          echo "=== CRED OFFSETS ==="
          pahole -C cred kernel.elf 2>/dev/null | grep -E "usage|caps|security|user|user_ns|group_info" || echo "pahole failed (no DWARF)"
          
          echo ""
          echo "=== RT_MUTEX_WAITER OFFSETS ==="
          pahole -C rt_mutex_waiter kernel.elf 2>/dev/null | head -n 20 || echo "pahole failed (no DWARF)"

      - name: Upload offsets
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-offsets
          path: boot_unpacked/kernel.elf
