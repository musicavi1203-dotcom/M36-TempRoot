name: disassemble_offsets
on: [push, workflow_dispatch]

jobs:
  disassemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout M36-TempRoot
        uses: actions/checkout@v4

      - name: Prepare kernel.elf
        run: |
          unzip boot_a.zip
          git clone https://android.googlesource.com/platform/system/tools/mkbootimg
          PYTHONPATH=mkbootimg python3 mkbootimg/unpack_bootimg.py --boot_img boot_a.img --out boot_unpacked
          cd boot_unpacked
          cp kernel kernel_raw.gz && gunzip kernel_raw.gz
          pip3 install vmlinux-to-elf
          vmlinux-to-elf kernel_raw kernel.elf

      - name: Install aarch64 binutils
        run: sudo apt-get update && sudo apt-get install -y binutils-aarch64-linux-gnu

      - name: Disassemble critical functions
        run: |
          cd boot_unpacked
          
          echo "=================================================="
          echo "=== get_task_comm (Accesses task->comm) ==="
          echo "=================================================="
          aarch64-linux-gnu-objdump -d --no-show-raw-insn kernel.elf | grep -A 20 "<get_task_comm>:" || echo "NOT FOUND"
          
          echo ""
          echo "=================================================="
          echo "=== commit_creds (Accesses task->cred and real_cred) ==="
          echo "=================================================="
          aarch64-linux-gnu-objdump -d --no-show-raw-insn kernel.elf | grep -A 40 "<commit_creds>:" || echo "NOT FOUND"
          
          echo ""
          echo "=================================================="
          echo "=== next_task (Accesses task->tasks) ==="
          echo "=================================================="
          aarch64-linux-gnu-objdump -d --no-show-raw-insn kernel.elf | grep -A 15 "<next_task>:" || echo "NOT FOUND"
