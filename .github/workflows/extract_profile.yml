name: disassemble_bpf
on: [push, workflow_dispatch]

jobs:
  disassemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout M36-TempRoot
        uses: actions/checkout@v4

      - name: Prepare kernel.elf
        run: |
          unzip boot_a.zip
          git clone https://android.googlesource.com/platform/system/tools/mkbootimg
          PYTHONPATH=mkbootimg python3 mkbootimg/unpack_bootimg.py --boot_img boot_a.img --out boot_unpacked
          cd boot_unpacked
          cp kernel kernel_raw.gz && gunzip kernel_raw.gz
          pip3 install vmlinux-to-elf
          vmlinux-to-elf kernel_raw kernel.elf

      - name: Install aarch64 binutils
        run: sudo apt-get update && sudo apt-get install -y binutils-aarch64-linux-gnu

      - name: Disassemble array_map_lookup_elem
        run: |
          cd boot_unpacked
          echo "=== array_map_lookup_elem ==="
          aarch64-linux-gnu-objdump -d --no-show-raw-insn kernel.elf | grep -A 40 "<array_map_lookup_elem>:" | head -n 45

      - name: Disassemble array_map_alloc
        run: |
          cd boot_unpacked
          echo "=== array_map_alloc ==="
          aarch64-linux-gnu-objdump -d --no-show-raw-insn kernel.elf | grep -A 50 "<array_map_alloc>:" | head -n 55
