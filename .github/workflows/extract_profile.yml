name: build_patched_apk
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GhostLock
        uses: actions/checkout@v4
        with:
          repository: YuKongA/ghostlock-app
          path: ghostlock-app

      - name: Patch ProfileMerger to accept kernel_major 4
        run: |
          cd ghostlock-app
          sed -i 's/in 5..6/in 4..6/g' profile-core/src/main/kotlin/com/ghostlock/app/data/profile/ProfileMerger.kt
          echo "=== After Kotlin patch ==="
          grep -n "in 4..6" profile-core/src/main/kotlin/com/ghostlock/app/data/profile/ProfileMerger.kt

      - name: Patch C++ PAGE_SIZE macro conflict
        run: |
          cd ghostlock-app
          FILE=$(find . -name "constants.hpp" | grep "core/kernel/constants.hpp" | head -n 1)
          echo "Patching C++ file: $FILE"
          # הוספת #undef PAGE_SIZE לפני השורה שמגדירה את המשתנה
          sed -i 's/    inline constexpr unsigned long PAGE_SIZE = 1UL << PAGE_SHIFT;/#undef PAGE_SIZE\n    inline constexpr unsigned long PAGE_SIZE = 1UL << PAGE_SHIFT;/' "$FILE"
          echo "=== After C++ patch ==="
          grep -A 2 -B 2 "PAGE_SIZE" "$FILE"

      - name: Install Rust targets and cargo-ndk
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android
          cargo install cargo-ndk

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c
          add-to-path: true

      - name: Build ghostlock-extract (Rust)
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cd ghostlock-app/tools/extract_rs
          cargo ndk -t arm64-v8a build --release

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Clean Gradle Cache
        run: |
          cd ghostlock-app
          rm -rf ~/.gradle/caches
          rm -rf build
          ./gradlew clean

      - name: Build APK
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cd ghostlock-app
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ghostlock-patched
          path: ghostlock-app/app/build/outputs/apk/release/*.apk
