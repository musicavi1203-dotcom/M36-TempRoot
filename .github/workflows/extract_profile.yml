name: check_multicast
on: [push, workflow_dispatch]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GhostLock
        uses: actions/checkout@v4
        with:
          repository: YuKongA/ghostlock-app
          
      - name: Find multicast validation
        run: |
          echo "=== multicast_waiter validation in AndroidProfileConfigController ==="
          grep -n -A 15 "multicast_waiter" app/src/main/kotlin/com/ghostlock/app/data/AndroidProfileConfigController.kt || echo "not found in controller"
          
          echo ""
          echo "=== multicast_waiter in RouteCommonRequired or Routes ==="
          grep -rn "multicast_waiter" profile-core/src/main/kotlin/com/ghostlock/app/data/ | head -n 20
          
          echo ""
          echo "=== multicast_waiter required fields ==="
          grep -rn "multicast" profile-core/src/main/kotlin/ app/src/main/kotlin/ | grep -i "required\|buffer_size\|waiter_off" || echo "not found"
