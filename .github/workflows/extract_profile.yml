name: find_validation_error
on: [workflow_dispatch]

jobs:
  find_error:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GhostLock
        uses: actions/checkout@v4
        with:
          repository: YuKongA/ghostlock-app
          
      - name: Search for validation throwing string
        run: |
          echo "=== Searching for kernel_profile_invalid usage ==="
          grep -rn "kernel_profile_invalid" . || echo "NOT FOUND"
          
          echo "=== Searching for all 'require' statements in ProfileMerger ==="
          grep -n "require" profile-core/src/main/kotlin/com/ghostlock/app/data/profile/ProfileMerger.kt
