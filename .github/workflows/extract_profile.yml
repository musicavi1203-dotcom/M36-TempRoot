name: Extract GhostLock Profile v3

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout M36-TempRoot repo
        uses: actions/checkout@v4

      - name: Checkout GhostLock repository
        uses: actions/checkout@v4
        with:
          repository: YuKongA/ghostlock-app
          path: ghostlock-app

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip git build-essential

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Patch extractor to allow 4.19
        run: |
          cd ghostlock-app/tools/extract_rs
          echo "=== Searching for version check ==="
          grep -rn "needs a 5" src/ || true
          grep -rn "5.x/6.x" src/ || true
          grep -rn "release" src/ | head -n 20 || true
          # Try to find and comment out the version check
          find src -name "*.rs" -exec sed -i 's/needs a 5\.x\/6\.x release/needs a 4.19+ release/g' {} \;
          echo "=== After patch ==="
          grep -rn "needs a 4" src/ || true

      - name: Build extractor (patched)
        run: |
          cd ghostlock-app/tools/extract_rs
          cargo build --release

      - name: Extract boot.img from ZIP
        run: |
          unzip boot_a.zip
          ls -la boot_a.img

      - name: Unpack boot.img
        run: |
          git clone https://android.googlesource.com/platform/system/tools/mkbootimg
          PYTHONPATH=mkbootimg python3 mkbootimg/unpack_bootimg.py --boot_img boot_a.img --out boot_unpacked

      - name: Decompress kernel
        run: |
          cd boot_unpacked
          cp kernel kernel_raw.gz
          gunzip kernel_raw.gz
          ls -la kernel_raw

      - name: Create kallsyms.txt
        run: |
          pip3 install vmlinux-to-elf
          cd boot_unpacked
          vmlinux-to-elf kernel_raw kernel.elf
          nm kernel.elf | sort > kallsyms.txt
          echo "kallsyms.txt lines: $(wc -l < kallsyms.txt)"

      - name: Create fake iomem
        run: |
          cat > /tmp/iomem.txt << 'EOF'
          00000000-00000000 : kernel_phys
          40000000-4007ffff : kernel_phys_load
          EOF
          cat /tmp/iomem.txt

      - name: Try extractor - MULTIPLE APPROACHES
        run: |
          BIN=$(find ghostlock-app -name "ghostlock-extract" -type f 2>/dev/null | head -n1)
          BIN=$(realpath "$BIN")
          echo "Found binary at: $BIN"
          chmod +x "$BIN"
          
          cd boot_unpacked
          
          echo "=== Approach A: --analysis to understand what extractor computes ==="
          "$BIN" kernel_raw --kallsyms kallsyms.txt --analysis 2>&1 || true
          
          echo ""
          echo "=== Approach B: --format json (maybe check is only for conf) ==="
          "$BIN" kernel_raw --kallsyms kallsyms.txt --phys 0x40080000 --format json --out profile.json 2>&1 || echo "FAILED_JSON"
          
          echo ""
          echo "=== Approach C: --format text ==="
          "$BIN" kernel_raw --kallsyms kallsyms.txt --phys 0x40080000 --format text --out profile.txt 2>&1 || echo "FAILED_TEXT"
          
          echo ""
          echo "=== Approach D: --format conf with --allow-missing ==="
          "$BIN" kernel_raw --kallsyms kallsyms.txt --phys 0x40080000 --format conf --allow-missing --out profile.conf 2>&1 || echo "FAILED_ALLOW_MISSING"
          
          echo ""
          echo "=== Results ==="
          for f in profile.json profile.txt profile.conf; do
            if [ -f "$f" ]; then
              echo "=== $f exists! ==="
              cat "$f"
              echo ""
            fi
          done
          
          if [ ! -f profile.conf ] && [ ! -f profile.json ] && [ ! -f profile.txt ]; then
            echo "NOTHING CREATED"
            exit 1
          fi

      - name: Upload any profiles
        uses: actions/upload-artifact@v4
        with:
          name: ghostlock-profiles
          path: |
            boot_unpacked/profile.conf
            boot_unpacked/profile.json
            boot_unpacked/profile.txt
          if-no-files-found: warn
