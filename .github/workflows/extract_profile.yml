name: find_all_validations
on: [workflow_dispatch]

jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GhostLock
        uses: actions/checkout@v4
        with:
          repository: YuKongA/ghostlock-app
          
      - name: Search all validation logic
        run: |
          echo "=== Where does profileValid come from? ==="
          grep -rn "profileValid" --include="*.kt" .
          
          echo ""
          echo "=== All require() in profile-core ==="
          grep -rn "require(" profile-core/src/main/kotlin/ || echo "none"
          
          echo ""
          echo "=== All throw/error in ProfileResolver ==="
          grep -rn "throw\|require\|isValid\|valid" profile-core/src/main/kotlin/com/ghostlock/app/data/profile/ProfileResolver.kt || echo "none"
          
          echo ""
          echo "=== All validation in NativeProfile.kt ==="
          grep -n "throw\|require\|invalid\|missing" profile-core/src/main/kotlin/com/ghostlock/app/data/NativeProfile.kt || echo "none"
          
          echo ""
          echo "=== Search for 'isValid' or 'validate' anywhere ==="
          grep -rn "fun isValid\|fun validate\|fun.*[Vv]alid" --include="*.kt" . | head -n 20
