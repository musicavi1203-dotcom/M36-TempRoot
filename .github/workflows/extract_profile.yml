name: inspect_exploit
on: [push, workflow_dispatch]

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Clone exploit
        run: |
          git clone https://github.com/Botti01/eBPF-CVE-exploitation.git
          cd eBPF-CVE-exploitation
          
      - name: Show key parts of exploit source
        run: |
          cd eBPF-CVE-exploitation
          
          echo "=== Searching for 'adjacent' or 'ops' in exploit.c ==="
          grep -rn "adjacent\|ops_offset\|bpf_map_ops\|BPF_MAP_OPS" CVEs/CVE-2021-3444/poc/ | head -n 40
          
          echo ""
          echo "=== Searching for leak logic ==="
          grep -rn "leak\|read_map\|dump_map" CVEs/CVE-2021-3444/poc/*.c | head -n 30
          
          echo ""
          echo "=== Show first 100 lines of exploit.c ==="
          head -n 100 CVEs/CVE-2021-3444/poc/exploit.c
