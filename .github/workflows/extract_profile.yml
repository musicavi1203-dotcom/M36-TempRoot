name: Extract GhostLock Profile

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout M36-TempRoot repo
        uses: actions/checkout@v4

      - name: Checkout GhostLock repository
        uses: actions/checkout@v4
        with:
          repository: YuKongA/ghostlock-app
          path: ghostlock-app

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build extractor
        run: |
          cd ghostlock-app/tools/extract_rs
          cargo build --release

      - name: Extract boot.img from ZIP
        run: |
          unzip boot_a.zip
          ls -la boot_a.img

      - name: Run extractor
        run: |
          cd ghostlock-app/tools/extract_rs
          # מחפשים את הבינארי אוטומטית
          BIN=$(find target/release -maxdepth 1 -type f -executable | head -n1)
          echo "Found binary: $BIN"
          "$BIN" ../../../boot_a.img --format conf --out profile.conf
          ls -la profile.conf
          echo "=== Profile contents ==="
          cat profile.conf

      - name: Upload profile
        uses: actions/upload-artifact@v4
        with:
          name: ghostlock-profile
          path: ghostlock-app/tools/extract_rs/profile.conf
          if-no-files-found: error
