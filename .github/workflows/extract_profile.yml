name: Extract GhostLock Profile

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout M36-TempRoot repo
        uses: actions/checkout@v4

      - name: Checkout GhostLock repository
        uses: actions/checkout@v4
        with:
          repository: YuKongA/ghostlock-app
          path: ghostlock-app

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build extractor
        run: |
          cd ghostlock-app/tools/extract_rs
          cargo build --release

      - name: Extract boot.img from ZIP
        run: |
          unzip boot_a.zip
          ls -la boot_a.img

      - name: Debug - find the binary
        run: |
          echo "=== Searching for ghostlock-extract ==="
          find . -name "ghostlock-extract" -type f 2>/dev/null
          echo "=== Looking in target/release ==="
          find . -type d -name "release" 2>/dev/null
          echo "=== Full extract_rs dir ==="
          ls -la ghostlock-app/tools/extract_rs/

      - name: Run extractor
        run: |
          BIN=$(find . -name "ghostlock-extract" -type f 2>/dev/null | head -n1)
          if [ -z "$BIN" ]; then
            echo "ERROR: Binary not found!"
            exit 1
          fi
          echo "Found binary at: $BIN"
          chmod +x "$BIN"
          "$BIN" boot_a.img --format conf --out profile.conf
          echo "=== Profile generated ==="
          ls -la profile.conf
          cat profile.conf

      - name: Upload profile
        uses: actions/upload-artifact@v4
        with:
          name: ghostlock-profile
          path: profile.conf
          if-no-files-found: error
