name: find_perf
on: [push, workflow_dispatch]

jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GhostLock
        uses: actions/checkout@v4
        with:
          repository: YuKongA/ghostlock-app
          
      - name: Search for perf_event in C++ source
        run: |
          echo "=== Search for perf_event_open ==="
          grep -rn "perf_event_open" core/ || echo "NOT FOUND"
          
          echo ""
          echo "=== Search for perf_event (struct/calls) ==="
          grep -rn "perf_event" core/ | head -n 30
