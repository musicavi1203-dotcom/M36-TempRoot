name: find_perf_path
on: [push, workflow_dispatch]

jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GhostLock
        uses: actions/checkout@v4
        with:
          repository: YuKongA/ghostlock-app
          
      - name: Find where perf_event_open is
        run: |
          echo "=== Find main.cpp (to know the C++ root) ==="
          find . -name "main.cpp"
          
          echo ""
          echo "=== Find files with perf_event_open ==="
          grep -rn "perf_event_open" . --include="*.cpp" --include="*.h" --include="*.hpp" || echo "NOT FOUND"
          
          echo ""
          echo "=== Find files with perf_find_task ==="
          grep -rn "perf_find_task" . --include="*.cpp" --include="*.h" --include="*.hpp" || echo "NOT FOUND"
          
          echo ""
          echo "=== Find files with perf leak logic ==="
          grep -rn "perf leak did not reproduce" . || echo "NOT FOUND"
