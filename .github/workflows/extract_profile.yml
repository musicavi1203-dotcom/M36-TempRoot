name: build_perf_bypass
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GhostLock
        uses: actions/checkout@v4
        with:
          repository: YuKongA/ghostlock-app
          path: ghostlock-app

      - name: Patch ProfileMerger
        run: |
          cd ghostlock-app
          sed -i 's/in 5..6/in 4..6/g' profile-core/src/main/kotlin/com/ghostlock/app/data/profile/ProfileMerger.kt
          sed -i 's/require(profile.containsKey("execution")) { "missing execution tuning" }/\/\/ bypassed/' profile-core/src/main/kotlin/com/ghostlock/app/data/profile/ProfileMerger.kt

      - name: Patch C++ (PAGE_SIZE + Perf)
        run: |
          cd ghostlock-app
          # PAGE_SIZE fix
          FILE=$(find . -name "constants.hpp" | grep "core/kernel/constants.hpp" | head -n 1)
          sed -i 's/    inline constexpr unsigned long PAGE_SIZE = 1UL << PAGE_SHIFT;/#undef PAGE_SIZE\n    inline constexpr unsigned long PAGE_SIZE = 1UL << PAGE_SHIFT;/' "$FILE"
          
          # Perf bypass
          python3 << 'PYEOF'
          with open('src/core/attack/ops.cpp', 'r') as f:
              content = f.read()
          
          old_code = '''        errno = 0;
                  support::UniqueFd fd(static_cast<int32_t>(syscall(__NR_perf_event_open, &pe, 0, -1, -1, 0)));'''
          
          new_code = '''        /* Try to relax perf_event_paranoid */
                  {
                      int pfd = static_cast<int>(syscall(__NR_openat, -100, "/proc/sys/kernel/perf_event_paranoid", 1, 0));
                      if (pfd >= 0) {
                          syscall(__NR_write, pfd, "-1", 2);
                          syscall(__NR_close, pfd);
                      }
                  }
                  errno = 0;
                  support::UniqueFd fd(static_cast<int32_t>(syscall(__NR_perf_event_open, &pe, 0, -1, -1, 0)));'''
          
          if old_code in content:
              content = content.replace(old_code, new_code)
              print("SUCCESS: Perf patch applied")
          else:
              print("ERROR: Pattern not found. Trying flexible search...")
              # Fallback: find the line and insert before
              import re
              pattern = r'(support::UniqueFd fd\(static_cast<int32_t>\(syscall\(__NR_perf_event_open)'
              match = re.search(pattern, content)
              if match:
                  insert_pos = match.start()
                  perf_comment = '/* relax perf_event_paranoid */ { int pfd = (int)syscall(__NR_openat, -100, "/proc/sys/kernel/perf_event_paranoid", 1, 0); if (pfd >= 0) { syscall(__NR_write, pfd, "-1", 2); syscall(__NR_close, pfd); } }\n        '
                  content = content[:insert_pos] + perf_comment + content[insert_pos:]
                  print("SUCCESS: Flexible patch applied")
              else:
                  print("FAILED: Could not find perf_event_open")
          
          with open('src/core/attack/ops.cpp', 'w') as f:
              f.write(content)
          PYEOF
          
          echo "=== Verifying patch ==="
          grep -A 5 "perf_event_paranoid" src/core/attack/ops.cpp || echo "PATCH NOT FOUND"

      - name: Install Rust targets and cargo-ndk
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android
          cargo install cargo-ndk

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c
          add-to-path: true

      - name: Build ghostlock-extract (Rust)
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cd ghostlock-app/tools/extract_rs
          cargo ndk -t arm64-v8a build --release

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Build APK
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cd ghostlock-app
          chmod +x gradlew
          ./gradlew assemble --stacktrace

      - name: Find and Copy APK
        run: find ghostlock-app -name "*.apk" -exec cp {} ./ \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ghostlock-perf-bypass
          path: "*.apk"
          if-no-files-found: error
