name: find_ops_offset_v2
on: [push, workflow_dispatch]

jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout M36-TempRoot
        uses: actions/checkout@v4

      - name: Prepare kernel.elf
        run: |
          unzip boot_a.zip
          git clone https://android.googlesource.com/platform/system/tools/mkbootimg
          PYTHONPATH=mkbootimg python3 mkbootimg/unpack_bootimg.py --boot_img boot_a.img --out boot_unpacked
          cd boot_unpacked
          cp kernel kernel_raw.gz && gunzip kernel_raw.gz
          pip3 install vmlinux-to-elf
          vmlinux-to-elf kernel_raw kernel.elf

      - name: Install binutils
        run: sudo apt-get update && sudo apt-get install -y binutils-aarch64-linux-gnu

      - name: Search for array_map_ops usage
        run: |
          cd boot_unpacked
          echo "=== Searching for array_map_ops address (ffffff8008f5d500) in disassembly ==="
          aarch64-linux-gnu-objdump -d kernel.elf | grep -B 5 -A 5 "ffffff8008f5d500" | head -n 60
          
          echo ""
          echo "=== Searching for str x?, [x?, #offset] near array_map_ops ==="
          aarch64-linux-gnu-objdump -d kernel.elf | grep -E "str.*\[.*#" | head -n 30
