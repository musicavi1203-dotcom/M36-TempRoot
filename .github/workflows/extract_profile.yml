name: check_4_19_symbols
on: [push, workflow_dispatch]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout M36-TempRoot
        uses: actions/checkout@v4

      - name: Prepare kernel.elf
        run: |
          unzip boot_a.zip
          git clone https://android.googlesource.com/platform/system/tools/mkbootimg
          PYTHONPATH=mkbootimg python3 mkbootimg/unpack_bootimg.py --boot_img boot_a.img --out boot_unpacked
          cd boot_unpacked
          cp kernel kernel_raw.gz && gunzip kernel_raw.gz
          pip3 install vmlinux-to-elf
          vmlinux-to-elf kernel_raw kernel.elf

      - name: Search for all symbols the 4.19 port needs
        run: |
          cd boot_unpacked
          echo "=== ashmem / configfs / pipe / symbols ==="
          nm kernel.elf | grep -iE "ashmem_misc|ashmem_fops|ashmem_ioctl|ashmem_mmap|ashmem_open|ashmem_release|ashmem_show_fdinfo|configfs_read_file|configfs_write_bin_file|generic_file_splice_read|noop_llseek|anon_pipe_buf_ops" || echo "--- SOME MISSING ---"
          
          echo ""
          echo "=== init_task / selinux / kmalloc / slide ==="
          nm kernel.elf | grep -iE "init_task|init_uts_ns|empty_zero_page|root_task_group|selinux_state|security_hook_heads|kmalloc_caches|nfulnl_logger|sysctl_bootid" || echo "--- SOME MISSING ---"
          
          echo ""
          echo "=== commit_creds / init_cred ==="
          nm kernel.elf | grep -iE "commit_creds|init_cred|prepare_kernel_cred" || echo "--- MISSING ---"
