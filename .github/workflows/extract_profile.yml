name: inspect_makefile
on: [push, workflow_dispatch]

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone and show Makefile
        run: |
          git clone https://github.com/yijiacloud/ghostlock-cve-2026-43499-4.19-k40.git
          cd ghostlock-cve-2026-43499-4.19-k40
          
          echo "=== Makefile (full) ==="
          cat Makefile
          
          echo ""
          echo "=== Directory structure of src/targets ==="
          find src/targets -type f -o -type d
          
          echo ""
          echo "=== Content of the default target.h (if exists) ==="
          find src/targets -name "target.h" -exec echo "--- {} ---" \; -exec grep -E "BUILD_VARIANT_LABEL|P0_PHYS_OFFSET|TASK_REAL_CRED_OFF" {} \;
