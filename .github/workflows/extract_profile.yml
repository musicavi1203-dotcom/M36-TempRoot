name: find_validation
on: [workflow_dispatch]

jobs:
  find_error:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GhostLock
        uses: actions/checkout@v4
        with:
          repository: YuKongA/ghostlock-app

      - name: Search for validation strings
        run: |
          echo "=== Searching for 'Profile needs correction' ==="
          grep -rn "Profile needs correction" . || echo "NOT FOUND"
          
          echo "=== Searching for 'needs correction' ==="
          grep -rn "needs correction" . || echo "NOT FOUND"
          
          echo "=== Searching for 'kernel_major' in Kotlin/Java ==="
          grep -rn "kernel_major" --include="*.kt" --include="*.java" . | head -n 20 || echo "NOT FOUND"
          
          echo "=== Searching for 'correct' in string resources ==="
          find . -name "strings.xml" -exec grep -Hn "correct\|correction" {} \; || echo "NOT FOUND"
