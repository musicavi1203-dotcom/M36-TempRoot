name: build_ebpf_leak
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libbpf-dev libelf-dev zlib1g-dev gcc-aarch64-linux-gnu

      - name: Build eBPF
        run: |
          cat << 'EOF' > leak.bpf.c
          #include <linux/bpf.h>
          #include <bpf/bpf_helpers.h>

          struct {
              __uint(type, BPF_MAP_TYPE_ARRAY);
              __uint(max_entries, 1);
              __type(key, __u32);
              __type(value, __u64);
          } leak_map SEC(".maps");

          SEC("kprobe/do_sys_open")
          int leak_kaslr(struct pt_regs *ctx) {
              __u32 key = 0;
              __u64 task = (__u64)bpf_get_current_task();
              bpf_map_update_elem(&leak_map, &key, &task, 0);
              return 0;
          }
          char _license[] SEC("license") = "GPL";
          EOF
          
          # הוספת נתיב ה-headers של x86_64
          clang -target bpf -O2 -g -I/usr/include/x86_64-linux-gnu -c leak.bpf.c -o leak.bpf.o
          
          echo "Build process complete."

      - name: Upload eBPF object
        uses: actions/upload-artifact@v4
        with:
          name: ebpf-leak
          path: leak.bpf.o
