name: find_invalid_paths
on: [push, workflow_dispatch]

jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GhostLock
        uses: actions/checkout@v4
        with:
          repository: YuKongA/ghostlock-app
          
      - name: Search profileInvalidPaths
        run: |
          echo "=== Where is profileInvalidPaths populated? ==="
          grep -rn "profileInvalidPaths" --include="*.kt" .
          
          echo ""
          echo "=== Validation functions ==="
          grep -rn "invalidPaths\|profileInvalid\|validateProfile" --include="*.kt" . | head -n 30
          
          echo ""
          echo "=== NativeProfile.kt lines 30-80 ==="
          sed -n '30,80p' profile-core/src/main/kotlin/com/ghostlock/app/data/NativeProfile.kt
          
          echo ""
          echo "=== Search for validate() or invalid field logic ==="
          grep -rn "invalid\|Invalid" profile-core/src/main/kotlin/com/ghostlock/app/data/ | head -n 30
