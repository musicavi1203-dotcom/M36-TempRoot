name: get_perf_code
on: [push, workflow_dispatch]

jobs:
  get_code:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GhostLock
        uses: actions/checkout@v4
        with:
          repository: YuKongA/ghostlock-app
          
      - name: Print C++ code for perf
        run: |
          echo "=== ops.cpp lines 425-465 ==="
          sed -n '425,465p' src/core/attack/ops.cpp
          
          echo ""
          echo "=== cve_2026_43499_backend.cpp lines 110-145 ==="
          sed -n '110,145p' src/core/session/backend/cve_2026_43499_backend.cpp
