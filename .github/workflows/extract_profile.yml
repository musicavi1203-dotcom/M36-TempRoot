name: build_botti_poc_original
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y gcc make git

      - name: Clone Botti01 repo
        run: |
          git clone https://github.com/Botti01/eBPF-CVE-exploitation.git

      - name: Show offsets used by PoC
        run: |
          cd eBPF-CVE-exploitation/CVEs/CVE-2021-3444/poc
          echo "=== Original offsets (x86_64) ==="
          grep -E "BPF_ARRAY_VALUE_OFFSET|MAP_VALUE_SIZE|OPS_OFFSET|KERNEL_BASE|ARRAY_MAP_OPS|COMMIT_CREDS|INIT_CRED" exploit.c

      - name: Compile PoC
        run: |
          cd eBPF-CVE-exploitation/CVEs/CVE-2021-3444/poc
          gcc -static -O2 -I ../../../common/include exploit.c -o exploit_botti
          file exploit_botti
          ls -la exploit_botti

      - uses: actions/upload-artifact@v4
        with:
          name: botti-poc-original
          path: eBPF-CVE-exploitation/CVEs/CVE-2021-3444/poc/exploit_botti
