name: botti_inspect_order
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y gcc make git

      - name: Clone and inspect
        run: |
          git clone https://github.com/Botti01/eBPF-CVE-exploitation.git
          cd eBPF-CVE-exploitation/CVEs/CVE-2021-3444/poc
          
          echo "=== All LOG_ lines (shows order of operations) ==="
          grep -n "LOG_OK\|LOG_INFO\|LOG_ERR\|LOG_WARN" exploit.c || true
          
          echo ""
          echo "=== Lines around 'Defragmented' ==="
          grep -B 10 -A 15 "Defragmented" exploit.c || true
          
          echo ""
          echo "=== Lines around 'Allocated 16' ==="
          grep -B 5 -A 10 "Allocated 16" exploit.c || true
          
          echo ""
          echo "=== Lines around 'Allocated 8' ==="
          grep -B 5 -A 10 "Allocated 8" exploit.c || true
          
          echo ""
          echo "=== All function calls in the setup area ==="
          grep -n "defrag\|alloc_target\|create_inner\|create_outer" exploit.c || true
