name: extract_ebpf_offsets
on: [push, workflow_dispatch]

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout M36-TempRoot
        uses: actions/checkout@v4

      - name: Prepare kernel.elf
        run: |
          unzip boot_a.zip
          git clone https://android.googlesource.com/platform/system/tools/mkbootimg
          PYTHONPATH=mkbootimg python3 mkbootimg/unpack_bootimg.py --boot_img boot_a.img --out boot_unpacked
          cd boot_unpacked
          cp kernel kernel_raw.gz && gunzip kernel_raw.gz
          pip3 install vmlinux-to-elf
          vmlinux-to-elf kernel_raw kernel.elf

      - name: Find eBPF symbols
        run: |
          cd boot_unpacked
          echo "=== eBPF Symbols ==="
          nm kernel.elf | grep -iE "array_map_ops|array_of_maps_map_ops|fd_array_map_delete_elem|commit_creds|init_cred" || echo "NOT FOUND"
          
          echo ""
          echo "=== bpf_map_alloc / bpf_map_get (for ops offset) ==="
          nm kernel.elf | grep -iE "bpf_map_alloc|bpf_map_get" | head -n 5
          
          echo ""
          echo "=== bpf_array_lookup / array_map_lookup (for value offset) ==="
          nm kernel.elf | grep -iE "array_map_lookup|bpf_array_lookup|array_map_alloc" | head -n 5
