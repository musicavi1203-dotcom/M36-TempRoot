name: show_k40_target
on: [push, workflow_dispatch]

jobs:
  show:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone K40 port and show target.h
        run: |
          git clone https://github.com/yijiacloud/ghostlock-cve-2026-43499-4.19-k40.git
          cd ghostlock-cve-2026-43499-4.19-k40
          
          echo "=== Available target directories ==="
          ls -la src/targets/
          
          echo ""
          echo "=== Full oplus-4.19.157-perf/target.h ==="
          cat src/targets/oplus-4.19.157-perf/target.h
          
          echo ""
          echo "=== File size: ==="
          wc -l src/targets/oplus-4.19.157-perf/target.h
