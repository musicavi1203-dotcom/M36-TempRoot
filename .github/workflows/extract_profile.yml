name: build_cpu_fix_v2
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GhostLock
        uses: actions/checkout@v4
        with:
          repository: YuKongA/ghostlock-app
          path: ghostlock-app

      - name: Patch Kotlin
        run: |
          cd ghostlock-app
          sed -i 's/in 5..6/in 4..6/g' profile-core/src/main/kotlin/com/ghostlock/app/data/profile/ProfileMerger.kt
          sed -i 's/require(profile.containsKey("execution")) { "missing execution tuning" }/\/\/ bypassed/' profile-core/src/main/kotlin/com/ghostlock/app/data/profile/ProfileMerger.kt

      - name: Patch C++ (PAGE_SIZE + CPU fix v2)
        run: |
          cd ghostlock-app
          
          # PAGE_SIZE fix
          FILE=$(find . -name "constants.hpp" | grep "core/kernel/constants.hpp" | head -n 1)
          sed -i 's/    inline constexpr unsigned long PAGE_SIZE = 1UL << PAGE_SHIFT;/#undef PAGE_SIZE\n    inline constexpr unsigned long PAGE_SIZE = 1UL << PAGE_SHIFT;/' "$FILE"
          
          # CPU fix: use (sysconf - 1) instead of sysconf
          find src/core -type f \( -name "*.cpp" -o -name "*.hpp" -o -name "*.h" \) -exec sed -i \
            -e 's/sysconf(_SC_NPROCESSORS_ONLN)/(sysconf(_SC_NPROCESSORS_ONLN) - 1)/g' \
            -e 's/get_nprocs()/(sysconf(_SC_NPROCESSORS_ONLN) - 1)/g' \
            {} \;
          
          echo "=== Verification ==="
          grep -rn "sysconf(_SC_NPROCESSORS_ONLN)" src/core/ | head -n 5

      - name: Install Rust targets and cargo-ndk
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android
          cargo install cargo-ndk

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c
          add-to-path: true

      - name: Build ghostlock-extract (Rust)
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cd ghostlock-app/tools/extract_rs
          cargo ndk -t arm64-v8a build --release

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Build APK
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cd ghostlock-app
          chmod +x gradlew
          ./gradlew assemble --stacktrace

      - name: Find and Copy APK
        run: find ghostlock-app -name "*.apk" -exec cp {} ./ \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ghostlock-cpu-fix-v2
          path: "*.apk"
          if-no-files-found: error
