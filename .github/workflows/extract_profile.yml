name: build_ebpf_lpe
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y gcc make git

      - name: Clone and build CVE-2022-23222 exploit
        run: |
          git clone https://github.com/tr3ee/CVE-2022-23222.git
          cd CVE-2022-23222
          gcc -static -O2 -pthread -I include exploit.c -o exp
          file exp
          ls -la exp

      - name: Upload exploit
        uses: actions/upload-artifact@v4
        with:
          name: ebpf-lpe
          path: CVE-2022-23222/exp
