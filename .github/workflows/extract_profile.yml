name: Extract GhostLock Profile v2

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout M36-TempRoot repo
        uses: actions/checkout@v4

      - name: Checkout GhostLock repository
        uses: actions/checkout@v4
        with:
          repository: YuKongA/ghostlock-app
          path: ghostlock-app

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip git build-essential

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build extractor
        run: |
          cd ghostlock-app/tools/extract_rs
          cargo build --release

      - name: Extract boot.img from ZIP
        run: |
          unzip boot_a.zip
          ls -la boot_a.img

      - name: Unpack boot.img manually (mkbootimg)
        run: |
          git clone https://android.googlesource.com/platform/system/tools/mkbootimg
          PYTHONPATH=mkbootimg python3 mkbootimg/unpack_bootimg.py --boot_img boot_a.img --out boot_unpacked
          echo "=== Contents of boot_unpacked ==="
          ls -la boot_unpacked/

      - name: Decompress kernel properly
        run: |
          cd boot_unpacked
          FILETYPE=$(file -b kernel)
          echo "Kernel type: $FILETYPE"
          
          if echo "$FILETYPE" | grep -qi "gzip"; then
            echo "Gzip detected, decompressing..."
            cp kernel kernel_raw.gz
            gunzip kernel_raw.gz
          elif echo "$FILETYPE" | grep -qi "ARM64\|aarch64"; then
            echo "Already raw ARM64 Image"
            cp kernel kernel_raw
          else
            echo "Unknown format, copying as-is"
            cp kernel kernel_raw
          fi
          
          echo "=== kernel_raw after decompress ==="
          ls -la kernel_raw
          file kernel_raw

      - name: Create kallsyms.txt from ELF
        run: |
          pip3 install vmlinux-to-elf
          cd boot_unpacked
          echo "=== Building ELF from kernel_raw ==="
          vmlinux-to-elf kernel_raw kernel.elf
          echo "=== Extracting symbols with nm ==="
          nm kernel.elf | sort > kallsyms.txt
          echo "kallsyms.txt lines: $(wc -l < kallsyms.txt)"
          head -n 5 kallsyms.txt

      - name: Try extractor with --kallsyms
        run: |
          BIN=$(find ghostlock-app -name "ghostlock-extract" -type f 2>/dev/null | head -n1)
          echo "Found binary at: $BIN"
          chmod +x "$BIN"
          
          cd boot_unpacked
          
          echo "=== Attempt 1: --kallsyms + --phys 0x40080000 ==="
          "$BIN" kernel_raw --kallsyms kallsyms.txt --phys 0x40080000 --format conf --out profile.conf 2>&1 || echo "FAILED_1"
          
          if [ ! -f profile.conf ]; then
            echo "=== Attempt 2: --kallsyms only ==="
            "$BIN" kernel_raw --kallsyms kallsyms.txt --format conf --out profile.conf 2>&1 || echo "FAILED_2"
          fi
          
          if [ ! -f profile.conf ]; then
            echo "=== Attempt 3: --kallsyms + --phys 1074266112 (decimal) ==="
            "$BIN" kernel_raw --kallsyms kallsyms.txt --phys 1074266112 --format conf --out profile.conf 2>&1 || echo "FAILED_3"
          fi
          
          echo "=== Result ==="
          if [ -f profile.conf ]; then
            echo "=== SUCCESS! Profile content: ==="
            cat profile.conf
          else
            echo "PROFILE STILL NOT CREATED"
            exit 1
          fi

      - name: Upload profile (if created)
        uses: actions/upload-artifact@v4
        with:
          name: ghostlock-profile
          path: boot_unpacked/profile.conf
          if-no-files-found: warn
