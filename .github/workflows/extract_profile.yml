name: find_duplicate_defines
on: [push, workflow_dispatch]

jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone K40 port
        run: |
          git clone https://github.com/yijiacloud/ghostlock-cve-2026-43499-4.19-k40.git
          cd ghostlock-cve-2026-43499-4.19-k40

      - name: Find all occurrences of the K40 label
        run: |
          cd ghostlock-cve-2026-43499-4.19-k40
          
          echo "=== Occurrences of 'oplus_4.19.157_perf_a13' in source ==="
          grep -rn "oplus_4.19.157_perf_a13" . --include="*.c" --include="*.h" --include="*.S"
          
          echo ""
          echo "=== Occurrences of 'BUILD_VARIANT_LABEL' in source ==="
          grep -rn "BUILD_VARIANT_LABEL" . --include="*.c" --include="*.h"
          
          echo ""
          echo "=== Occurrences of 'P0_PHYS_OFFSET' in source ==="
          grep -rn "P0_PHYS_OFFSET" . --include="*.c" --include="*.h" | head -n 20
          
          echo ""
          echo "=== Occurrences of 'P0_KERNEL_PHYS_LOAD' in source ==="
          grep -rn "P0_KERNEL_PHYS_LOAD" . --include="*.c" --include="*.h" | head -n 20
